name: Release

# v* 태그 push 한 번으로 npm + MCP 레지스트리 동시 배포.
# 사전 1회 설정(필수): npmjs.com → ncloud-mcp-server 패키지 설정 → Trusted Publisher에
# 이 저장소의 GitHub Actions(release.yml)를 등록해야 npm publish가 토큰/OTP 없이 동작한다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing(OIDC) + mcp-publisher github-oidc 로그인

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing은 npm 11.5.1+ 필요 (Node 22 동봉 npm은 10.x)
      - run: npm install -g npm@latest

      - name: Verify tag matches package.json, package-lock.json and server.json versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          # package-lock.json은 최상단(.version)과 루트 패키지(.packages[''].version) 두 곳에 버전이 있다.
          # 버전 범프 시 npm install 누락으로 lock이 옛 버전에 남는 드리프트를 여기서 잡는다.
          LOCK=$(node -p "require('./package-lock.json').version")
          LOCKROOT=$(node -p "require('./package-lock.json').packages[''].version")
          echo "tag=$TAG package.json=$PKG package-lock.json=$LOCK package-lock(root)=$LOCKROOT server.json=$SRV server.json(packages[0])=$SRVPKG"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$LOCK" ] || [ "$TAG" != "$LOCKROOT" ] || [ "$TAG" != "$SRV" ] || [ "$TAG" != "$SRVPKG" ]; then
            echo "::error::버전 불일치 — 태그/package.json/package-lock.json/server.json을 맞춘 뒤(npm install로 lock 동기화) 다시 태그하세요."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Trusted Publishing(OIDC): 토큰/OTP 불필요, provenance 자동 첨부.
      # 같은 버전이 이미 게시돼 있으면 건너뛴다 — 후속 스텝 실패로 인한 재실행을 멱등하게.
      - name: Publish to npm
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if npm view "ncloud-mcp-server@$TAG" version >/dev/null 2>&1; then
            echo "ncloud-mcp-server@$TAG already on npm — skipping publish."
          else
            npm publish
          fi

      # 비인증 GitHub API는 공용 러너 IP에서 레이트리밋에 걸린다 — GITHUB_TOKEN으로 인증 + 빈 URL 가드
      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 주의: registry_linux_amd64.tar.gz 자산도 있으므로 파일명까지 정확히 매치해야 한다
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*/mcp-publisher_linux_amd64\.tar\.gz"' \
            | grep -o 'https[^"]*' | head -1)
          if [ -z "$URL" ]; then
            echo "::error::mcp-publisher 다운로드 URL을 찾지 못했습니다 (API 응답/자산 이름 확인 필요)."
            exit 1
          fi
          echo "downloading: $URL"
          curl -fsSL "$URL" | tar xz mcp-publisher

      # MCP 레지스트리는 등록 시 npm에서 해당 버전을 조회한다. npm publish 직후에는 전파가 끝나지 않아
      # "version '1.14.0' was not found (status: 404)"로 400이 난다(v1.14.0 배포에서 실제 발생 — npm publish
      # 성공 후 10초 만에 조회해 실패, 1분 뒤에는 보였다). 버전이 보일 때까지 기다린 뒤 등록한다.
      - name: Wait for the npm release to propagate
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if npm view "ncloud-mcp-server@$TAG" version >/dev/null 2>&1; then
              echo "ncloud-mcp-server@$TAG is visible on npm."
              exit 0
            fi
            echo "attempt $i/30: ncloud-mcp-server@$TAG not visible yet — waiting 10s"
            sleep 10
          done
          echo "::error::ncloud-mcp-server@$TAG did not appear on npm within 5 minutes."
          exit 1

      # 레지스트리 측 캐시가 npm보다 더 늦을 수 있어 등록 자체도 짧게 재시도한다.
      - name: Publish to MCP registry
        run: |
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "mcp-publisher publish failed (attempt $i/5) — retrying in 20s"
            sleep 20
          done
          echo "::error::MCP registry publish failed after 5 attempts. Re-run this job once npm shows the version: it is idempotent (npm publish is skipped when the version already exists)."
          exit 1
